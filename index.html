<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFFFF">
<title>NHIS 리마인더 설치</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --ink:#191F1D; --sub:#8B9490; --line:#EEF0EF; --chip:#F2F4F3; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:#fff; color:var(--ink); font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; -webkit-text-size-adjust:100%; }
  main { max-width:480px; margin:0 auto; padding:72px 24px 140px; }
  .icon { width:96px; height:96px; border-radius:26px; display:block; margin:0 auto 22px; box-shadow:0 10px 30px rgba(25,31,29,.12); }
  h1 { margin:0; text-align:center; font-size:30px; font-weight:800; letter-spacing:-.03em; line-height:1.2; }
  .sub { margin:8px 0 0; text-align:center; font-size:17px; color:var(--sub); font-weight:500; }
  .steps { margin:56px 0 0; }
  .steps > div { display:flex; align-items:center; gap:16px; padding:20px 0; border-top:1px solid var(--line); font-size:20px; font-weight:600; letter-spacing:-.02em; }
  .steps > div:last-child { border-bottom:1px solid var(--line); }
  .steps b { flex:none; width:32px; height:32px; border-radius:50%; background:var(--chip); color:var(--ink); font-size:15px; font-weight:800; display:flex; align-items:center; justify-content:center; }
  .cta { position:fixed; left:0; right:0; bottom:0; padding:12px 20px calc(16px + env(safe-area-inset-bottom)); background:linear-gradient(180deg, rgba(255,255,255,0), #fff 40%); }
  .cta a { display:flex; align-items:center; justify-content:center; max-width:432px; margin:0 auto; height:60px; border-radius:16px; background:var(--ink); color:#fff; text-decoration:none; font-size:19px; font-weight:700; letter-spacing:-.02em; }
  .cta a:active { opacity:.85; }
  .ver { text-align:center; font-size:13px; color:var(--sub); margin:28px 0 0; }
</style>
</head>
<body>
<main>
  <img class="icon" src="icon.png" alt="">
  <h1>NHIS 리마인더</h1>
  <p class="sub">안드로이드용</p>

  <div class="steps" id="android">
    <div><b>1</b>다운로드한 파일 열기</div>
    <div><b>2</b>"알 수 없는 앱" 안내가 뜨면 허용</div>
    <div><b>3</b>설치 누르기</div>
  </div>
  <div class="steps" id="ios" hidden>
    <div><b>1</b>앱스토어에서 TestFlight 설치</div>
    <div><b>2</b>아래 버튼 누르고 "참여"</div>
  </div>

  <p class="ver">v1.0.0 (85)</p>
</main>

<div class="cta">
  <a id="cta-android" href="https://wueasumbslbfayumesow.supabase.co/storage/v1/object/public/apk/nhis-reminder-latest.apk" download="nhis-reminder.apk">앱 받기</a>
  <a id="cta-ios" href="#" hidden>아이폰용 받기</a>
</div>
<script>
  // 아이폰·아이패드로 열면 TestFlight 안내, 그 밖에는 안드로이드 APK
  var TESTFLIGHT = 'https://testflight.apple.com/join/R8UW2sNM';
  var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (ios) {
    document.getElementById('android').hidden = true;
    document.getElementById('cta-android').hidden = true;
    document.querySelector('.sub').textContent = '아이폰용';
    var b = document.getElementById('cta-ios');
    if (TESTFLIGHT) { document.getElementById('ios').hidden = false; b.href = TESTFLIGHT; b.hidden = false; }
    else { document.getElementById('ios').innerHTML = '<div><b>!</b>아이폰용은 준비 중입니다</div>'; document.getElementById('ios').hidden = false; }
  }
</script>
</body>
</html>
